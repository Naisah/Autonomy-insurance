      x-roles: [service]
      x-scope: rewards:close-period
      x-stories: [G3, G4]
      x-priority: Should
      x-demo: true
      responses:
        '200':
          description: Closed; the results are queued for delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClosePeriodResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token from auth (aud core-api for core-api and auth routes).
    rewardsBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Rewards app access token from SSO (aud rewards-api, Client only).
    serviceKey:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Service-account token from POST /service/token. Never accepted by user routes.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repeating a request with the same key returns the first result.
      schema: { type: string, maxLength: 100 }

  responses:
    Validation:
      description: Invalid input (VALIDATION)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: No valid token (UNAUTHORIZED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Valid token without permission (FORBIDDEN)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Missing or hidden record (NOT_FOUND)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Already exists or clashes with the current data (CONFLICT)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidState:
      description: Not allowed in the record's current status (INVALID_STATE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoAgentAssigned:
      description: The client is waiting for an agent (NO_AGENT_ASSIGNED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AccountBlocked:
      description: Too many failed logins (ACCOUNT_BLOCKED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests (RATE_LIMITED)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    AiUnavailable:
      description: The assistant cannot answer right now (AI_UNAVAILABLE)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # -------------------------------------------------------------- shared
    Health:
      type: object
      required: [status, service]
      properties:
        status: { type: string, enum: [ok] }
        service: { type: string, enum: [auth, core-api, rewards-api] }
        version: { type: string }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, VALIDATION, CONFLICT, ACCOUNT_BLOCKED, RATE_LIMITED, AI_UNAVAILABLE, NO_AGENT_ASSIGNED, INVALID_STATE, INTERNAL]
            message: { type: string }
            requestId: { type: string }
            fields:
              type: object
              description: Field errors for VALIDATION
              additionalProperties: { type: string }
            retryAfterSeconds: { type: integer, description: "For ACCOUNT_BLOCKED and RATE_LIMITED" }
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      description: Pesos with two decimals
      example: '1818.88'
    Period:
      type: string
      pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      example: '2026-11'
    Role:
      type: string
      enum: [Client, Agent, Manager, Admin]
    UserStatus:
      type: string
      enum: [Active, Deactivated]
    Availability:
      type: string
      enum: [Available, Away]
    AgentStatus:
      type: string
      enum: [Assigned, Waiting]
      description: Waiting means no agent is assigned yet
    RewardStatus:
      type: string
      enum: [Bronze, Silver, Gold, Platinum]
    PersonRef:
      type: object
      required: [id, fullName]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }

    # -------------------------------------------------------------- auth
    RegisterRequest:
      type: object
      required: [fullName, email, password, acceptTerms]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: At least 8 characters with a letter and a number
        acceptTerms: { type: boolean, const: true }
        client: { $ref: '#/components/schemas/ClientKind' }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }
        client: { $ref: '#/components/schemas/ClientKind' }
    ClientKind:
      type: string
      enum: [web, mobile]
      default: web
      description: web gets the refresh token as an httpOnly cookie; mobile in the body
    RefreshRequest:
      type: object
      properties:
        refreshToken: { type: string, description: "Mobile only; web uses the cookie" }
    TokenPair:
      type: object
      required: [accessToken, expiresInSeconds]
      properties:
        accessToken: { type: string }
        expiresInSeconds: { type: integer, example: 900 }
        refreshToken: { type: string, description: "Present for mobile and the Rewards app" }
    AuthResult:
      allOf:
        - { $ref: '#/components/schemas/TokenPair' }
        - type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/User' }
    User:
      type: object
      required: [id, email, fullName, role, status, mustChangePassword]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        mustChangePassword: { type: boolean }
        reportsTo: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        agentStatus: { $ref: '#/components/schemas/AgentStatus', description: "Clients only" }
        availability: { $ref: '#/components/schemas/Availability', description: "Agents only" }
        maxClients: { type: integer, minimum: 1, maximum: 100, description: "Agents only" }
        createdAt: { type: string, format: date-time }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 8, maxLength: 128 }
    StaffDirectoryEntry:
      type: object
      description: Account as seen by Admin and Manager. No reward data.
      required: [id, email, fullName, role, status]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        reportsTo: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        availability: { $ref: '#/components/schemas/Availability' }
        maxClients: { type: integer }
        clientCount: { type: integer, description: "Agents only" }
        waitingSince: { type: [string, 'null'], format: date-time, description: "Clients waiting for an agent" }
        createdAt: { type: string, format: date-time }
    StaffDirectoryPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/StaffDirectoryEntry' } }
        nextCursor: { type: [string, 'null'] }
    CreateUserRequest:
      type: object
      required: [fullName, email, role, temporaryPassword]
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        email: { type: string, format: email }
        role: { type: string, enum: [Manager, Agent] }
        reportsTo: { type: string, format: uuid, description: "Required for an Agent (a Manager id)" }
        temporaryPassword: { type: string, minLength: 8, maxLength: 128 }
        maxClients: { type: integer, minimum: 1, maximum: 100 }
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 2, maxLength: 100 }
        role: { $ref: '#/components/schemas/Role' }
        reportsTo: { type: [string, 'null'], format: uuid }
        status: { $ref: '#/components/schemas/UserStatus' }
        maxClients: { type: integer, minimum: 1, maximum: 100 }
    SsoAuthorizeRequest:
      type: object
      required: [clientId, codeChallenge, codeChallengeMethod]
      properties:
        clientId: { type: string, enum: [rewards] }
        codeChallenge: { type: string, minLength: 43, maxLength: 128 }
        codeChallengeMethod: { type: string, enum: [S256] }
    SsoTokenRequest:
      type: object
      required: [code, codeVerifier, clientId]
      properties:
        code: { type: string }
        codeVerifier: { type: string, minLength: 43, maxLength: 128 }
        clientId: { type: string, enum: [rewards] }
    ServiceTokenRequest:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId: { type: string, example: rewards-api }
        clientSecret: { type: string }
    DirectoryEvent:
      type: object
      required: [type, userId, version, occurredAt]
      properties:
        type: { type: string, enum: [user.created, user.updated, user.deactivated, user.reassigned, agent.availability, client.waiting] }
        userId: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        user:
          type: object
          description: Snapshot of the directory fields (no email, no password)
          properties:
            fullName: { type: string }
            role: { $ref: '#/components/schemas/Role' }
            reportsTo: { type: [string, 'null'], format: uuid }
            status: { $ref: '#/components/schemas/UserStatus' }
            availability: { oneOf: [{ $ref: '#/components/schemas/Availability' }, { type: 'null' }] }
            maxClients: { type: [integer, 'null'] }

    # -------------------------------------------------------------- dashboard
    Dashboard:
      oneOf:
        - { $ref: '#/components/schemas/ClientDashboard' }
        - { $ref: '#/components/schemas/AgentDashboardStaff' }
        - { $ref: '#/components/schemas/ManagerDashboardStaff' }
        - { $ref: '#/components/schemas/AdminDashboardStaff' }
      discriminator:
        propertyName: role
        mapping:
          Client: '#/components/schemas/ClientDashboard'
          Agent: '#/components/schemas/AgentDashboardStaff'
          Manager: '#/components/schemas/ManagerDashboardStaff'
          Admin: '#/components/schemas/AdminDashboardStaff'
    ClientDashboard:
      type: object
      required: [role, agentStatus, unreadMessages, policies, draftEstimates, openClaims]
      properties:
        role: { type: string, const: Client }
        agentStatus: { $ref: '#/components/schemas/AgentStatus' }
        agent:
          oneOf:
            - type: object
              required: [id, fullName, availability]
              properties:
                id: { type: string, format: uuid }
                fullName: { type: string }
                availability: { $ref: '#/components/schemas/Availability' }
            - type: 'null'
        unreadMessages: { type: integer }
        policies: { type: array, items: { $ref: '#/components/schemas/PolicyClient' } }
        nextPayment: { oneOf: [{ $ref: '#/components/schemas/ScheduleItemClient' }, { type: 'null' }] }
        draftEstimates: { type: array, items: { $ref: '#/components/schemas/Estimate' } }
        openClaims: { type: array, items: { $ref: '#/components/schemas/ClaimClient' } }
        rewardStatus: { $ref: '#/components/schemas/RewardStatus' }
        rewardNote: { type: [string, 'null'], description: "'For example \"Your Gold level gives you 14 extra days to pay each premium.\"'" }
    AgentDashboardStaff:
      type: object
      required: [role, availability, clientCount, maxClients, unreadConversations, pendingEstimates, openClaims]
      properties:
        role: { type: string, const: Agent }
        availability: { $ref: '#/components/schemas/Availability' }
        clientCount: { type: integer }
        maxClients: { type: integer }
        unreadConversations: { type: integer }
        pendingEstimates: { type: integer }
        openClaims: { type: integer }
    ManagerDashboardStaff:
      type: object
      required: [role, agents, openEscalations, waitingClients, unreadNotifications]
      properties:
        role: { type: string, const: Manager }
        agents: { type: array, items: { $ref: '#/components/schemas/TeamAgentStaff' } }
        openEscalations: { type: integer }
        waitingClients: { type: integer }
        unreadNotifications: { type: integer }
    AdminDashboardStaff:
      type: object
      required: [role, usersByRole, waitingClients, conversations, messagesLast7Days, estimatesByStatus, claimsByStatus, unreadNotifications]
      properties:
        role: { type: string, const: Admin }
        usersByRole: { type: object, additionalProperties: { type: integer } }
        waitingClients: { type: integer }
        conversations: { type: integer, description: "Count only; no chat content" }
        messagesLast7Days: { type: integer }
        estimatesByStatus: { type: object, additionalProperties: { type: integer } }
        claimsByStatus: { type: object, additionalProperties: { type: integer } }
        unreadNotifications: { type: integer }
    TeamAgentStaff:
      type: object
      required: [id, fullName, availability, clientCount, maxClients, openConversations, pendingEstimates, openClaims]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        availability: { $ref: '#/components/schemas/Availability' }
        clientCount: { type: integer }
        maxClients: { type: integer }
        openConversations: { type: integer }
        pendingEstimates: { type: integer }
        openClaims: { type: integer }

    # -------------------------------------------------------------- chat
    ConversationSummary:
      type: object
      required: [id, client, unreadCount]
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/PersonRef' }
        agent: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }], description: null while the client waits }
        lastMessage: { oneOf: [{ $ref: '#/components/schemas/Message' }, { type: 'null' }] }
        unreadCount: { type: integer }
        openEscalation: { oneOf: [{ $ref: '#/components/schemas/Escalation' }, { type: 'null' }] }
    MessageKind:
      type: string
      enum: [Text, System, Handoff, Attachment]
    Message:
      type: object
      required: [id, conversationId, kind, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        sender: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }], description: null for System messages }
        senderRole: { oneOf: [{ $ref: '#/components/schemas/Role' }, { type: 'null' }] }
        kind: { $ref: '#/components/schemas/MessageKind' }
        body: { type: string }
        clientMessageId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        attachment:
          description: Set when kind is Attachment; body is then the caption (may be empty)
          oneOf:
            - { $ref: '#/components/schemas/Attachment' }
            - { type: 'null' }
    SendMessageRequest:
      type: object
      required: [body, clientMessageId]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
        clientMessageId: { type: string, minLength: 1, maxLength: 64 }
    Attachment:
      type: object
      description: A chat file's metadata. The content is read with GET /attachments/{id}/content.
      required: [id, fileName, mimeType, sizeBytes]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string, maxLength: 255 }
        mimeType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
    SendAttachmentRequest:
      type: object
      required: [file, clientMessageId]
      properties:
        file:
          type: string
          format: binary
          description: JPEG, PNG or PDF, at most 5,242,880 bytes
        clientMessageId: { type: string, minLength: 1, maxLength: 64 }
        body: { type: string, minLength: 0, maxLength: 2000, description: Optional caption }
    ClosePeriodResult:
      type: object
      required: [period, clientsClosed]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        clientsClosed: { type: integer, minimum: 0 }
    EscalationStatus:
      type: string
      enum: [Open, Resolved]
    Escalation:
      type: object
      required: [id, conversationId, client, escalatedBy, reason, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/PersonRef' }
        escalatedBy: { $ref: '#/components/schemas/PersonRef' }
        reason: { type: string }
        status: { $ref: '#/components/schemas/EscalationStatus' }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    # -------------------------------------------------------------- AI
    AiMessage:
      type: object
      required: [id, role, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [User, Assistant] }
        body: { type: string }
        refused: { type: boolean }
        createdAt: { type: string, format: date-time }
    AiConversation:
      type: object
      required: [id, messages]
      properties:
        id: { type: string, format: uuid }
        messages: { type: array, items: { $ref: '#/components/schemas/AiMessage' } }
    AiReply:
      type: object
      required: [userMessage, reply, handoffSuggested]
      properties:
        userMessage: { $ref: '#/components/schemas/AiMessage' }
        reply: { $ref: '#/components/schemas/AiMessage' }
        handoffSuggested: { type: boolean, description: "True after two \"I don't know\" answers in a row" }
        source: { type: string, enum: [model, fallback] }

    # -------------------------------------------------------------- estimates
    EstimateStatus:
      type: string
      enum: [Draft, Sent, ChangesRequested, Approved]
    EstimateInput:
      type: object
      required: [age, coverageAmount, termYears]
      properties:
        age: { type: integer, minimum: 18, maximum: 65 }
        coverageAmount: { type: integer, minimum: 500000, maximum: 20000000, description: "Whole pesos" }
        termYears: { type: integer, enum: [10, 20, 30] }
    PremiumBreakdown:
      type: object
      required: [base, ageAdjustment, termAdjustment, monthlyPremium, formulaVersion]
      description: No reward discount exists (decision D1).
      properties:
        base: { $ref: '#/components/schemas/Money' }
        ageAdjustment: { $ref: '#/components/schemas/Money' }
        termAdjustment: { $ref: '#/components/schemas/Money' }
        monthlyPremium: { $ref: '#/components/schemas/Money' }
        formulaVersion: { type: string, example: v1 }
    Estimate:
      type: object
      required: [id, age, coverageAmount, termYears, monthlyPremium, breakdown, formulaVersion, status, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        age: { type: integer }
        coverageAmount: { type: integer }
        termYears: { type: integer }
        monthlyPremium: { $ref: '#/components/schemas/Money' }
        breakdown: { $ref: '#/components/schemas/PremiumBreakdown' }
        formulaVersion: { type: string }
        status: { $ref: '#/components/schemas/EstimateStatus' }
        reviewNote: { type: [string, 'null'] }
        policyId: { type: [string, 'null'], format: uuid }
        sentAt: { type: [string, 'null'], format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    EstimatePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Estimate' } }
        nextCursor: { type: [string, 'null'] }
    EstimateStaff:
      type: object
      required: [id, client, age, coverageAmount, termYears, monthlyPremium, breakdown, formulaVersion, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        client: { $ref: '#/components/schemas/PersonRef' }
        age: { type: integer }
        coverageAmount: { type: integer }
        termYears: { type: integer }
        monthlyPremium: { $ref: '#/components/schemas/Money' }
        breakdown: { $ref: '#/components/schemas/PremiumBreakdown' }
        formulaVersion: { type: string }
        status: { $ref: '#/components/schemas/EstimateStatus' }
        reviewNote: { type: [string, 'null'] }
        sentAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    # -------------------------------------------------------------- policies
    PolicyStatus:
      type: string
      enum: [Active, Lapsed, Closed]
    PaymentDisplayStatus:
      type: string
      enum: [Upcoming, Paid, Overdue]
    Beneficiary:
      type: object
      required: [name, relationship, sharePercent]
      properties:
        name: { type: string }
        relationship: { type: string }
        sharePercent: { type: integer, minimum: 1, maximum: 100 }
    PolicyClient:
      type: object
      required: [id, policyNumber, productName, coverageAmount, termYears, monthlyPremium, startDate, status]
      properties:
        id: { type: string, format: uuid }
        policyNumber: { type: string, example: INS-4829 }
        productName: { type: string, example: 20-Year Term Life }
        coverageAmount: { $ref: '#/components/schemas/Money' }
        termYears: { type: integer }
        monthlyPremium: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/PolicyStatus' }
        agent: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        beneficiaries: { type: array, items: { $ref: '#/components/schemas/Beneficiary' } }
        nextPayment: { oneOf: [{ $ref: '#/components/schemas/ScheduleItemClient' }, { type: 'null' }] }
        rewardStatus: { $ref: '#/components/schemas/RewardStatus' }
        rewardNote: { type: [string, 'null'], description: "'For example \"Due date extended by 14 days. Based on your Rewards activity.\"'" }
    ScheduleItemClient:
      type: object
      required: [id, sequence, dueDate, effectiveDueDate, amount, displayStatus]
      properties:
        id: { type: string, format: uuid }
        sequence: { type: integer }
        dueDate: { type: string, format: date }
        effectiveDueDate: { type: string, format: date, description: "Due date plus the extension for the level on the due date" }
        amount: { $ref: '#/components/schemas/Money' }
        displayStatus: { $ref: '#/components/schemas/PaymentDisplayStatus' }
        paidAt: { type: [string, 'null'], format: date-time }
        reasonLabel: { type: [string, 'null'], description: "'\"Based on your Rewards activity\" when extended'" }
    PolicyStaff:
      type: object
      description: Policy as seen by the agent. Original due dates only; no reward fields.
      required: [id, policyNumber, client, productName, coverageAmount, termYears, monthlyPremium, startDate, status]
      properties:
        id: { type: string, format: uuid }
        policyNumber: { type: string }
        client: { $ref: '#/components/schemas/PersonRef' }
        productName: { type: string }
        coverageAmount: { $ref: '#/components/schemas/Money' }
        termYears: { type: integer }
        monthlyPremium: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/PolicyStatus' }
        paidCount: { type: integer }
        nextDueDate: { type: [string, 'null'], format: date, description: "Original due date" }

    # -------------------------------------------------------------- claims
    ClaimType:
      type: string
      enum: [Death, CriticalIllness, Disability]
    ClaimStatus:
      type: string
      enum: [Draft, Submitted, UnderReview, NeedsInfo, Approved, Paid, Rejected]
    ClaimInput:
      type: object
      required: [policyId, claimType, eventDate, amountRequested, description]
      properties:
        policyId: { type: string, format: uuid }
        claimType: { $ref: '#/components/schemas/ClaimType' }
        eventDate: { type: string, format: date, description: "Not in the future" }
        amountRequested: { $ref: '#/components/schemas/Money' }
        description: { type: string, minLength: 1, maxLength: 2000 }
    ClaimDocument:
      type: object
      required: [id, fileName, fileSizeBytes, mimeType, createdAt]
      properties:
        id: { type: string, format: uuid }
        fileName: { type: string }
        fileSizeBytes: { type: integer }
        mimeType: { type: string }
        createdAt: { type: string, format: date-time }
    ClaimEvent:
      type: object
      required: [toStatus, createdAt]
      properties:
        fromStatus: { oneOf: [{ $ref: '#/components/schemas/ClaimStatus' }, { type: 'null' }] }
        toStatus: { $ref: '#/components/schemas/ClaimStatus' }
        note: { type: [string, 'null'] }
        actor: { oneOf: [{ $ref: '#/components/schemas/PersonRef' }, { type: 'null' }] }
        createdAt: { type: string, format: date-time }
    ClaimClient:
      type: object
      required: [id, policyId, policyNumber, claimType, eventDate, amountRequested, description, status, documents, timeline, createdAt]
      properties:
        id: { type: string, format: uuid }
        claimNumber: { type: [string, 'null'], example: CLM-1042, description: "Set at submit" }
        policyId: { type: string, format: uuid }
        policyNumber: { type: string }
        claimType: { $ref: '#/components/schemas/ClaimType' }
        eventDate: { type: string, format: date }
        amountRequested: { $ref: '#/components/schemas/Money' }
        amountApproved: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        description: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        documents: { type: array, items: { $ref: '#/components/schemas/ClaimDocument' } }
        timeline: { type: array, items: { $ref: '#/components/schemas/ClaimEvent' } }
        payoutDueDate: { type: [string, 'null'], format: date, description: "Client only" }
        payoutDelayDays: { type: integer, description: "Client only" }
        reasonLabel: { type: [string, 'null'], description: "'\"Based on your Rewards activity\" when delayed'" }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    ClaimStaff:
      type: object
      description: Claim as seen by the agent. No payout date and no reward data.
      required: [id, claimNumber, client, policyNumber, claimType, eventDate, amountRequested, description, status, documents, timeline]
      properties:
        id: { type: string, format: uuid }
        claimNumber: { type: string }
        client: { $ref: '#/components/schemas/PersonRef' }
        policyNumber: { type: string }
        claimType: { $ref: '#/components/schemas/ClaimType' }
        eventDate: { type: string, format: date }
        amountRequested: { $ref: '#/components/schemas/Money' }
        amountApproved: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }] }
        description: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        documents: { type: array, items: { $ref: '#/components/schemas/ClaimDocument' } }
        timeline: { type: array, items: { $ref: '#/components/schemas/ClaimEvent' } }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time, description: "Approval or rejection date" }
    ClaimDecisionRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [StartReview, Approve, RequestInfo, Reject, MarkPaid] }
        amountApproved: { $ref: '#/components/schemas/Money' }
        note: { type: string, maxLength: 1000 }

    # -------------------------------------------------------------- settings
    EstimateRateInput:
      type: object
      required: [baseRate, ageFactorPerYear, ageFreeUntil, termFactorPerYear]
      properties:
        baseRate: { type: number, exclusiveMinimum: 0, maximum: 100 }
        ageFactorPerYear: { type: number, minimum: 0, maximum: 1 }
        ageFreeUntil: { type: integer, minimum: 18, maximum: 65 }
        termFactorPerYear: { type: number, minimum: 0, maximum: 1 }
    EstimateRate:
      allOf:
        - { $ref: '#/components/schemas/EstimateRateInput' }
        - type: object
          required: [formulaVersion]
          properties:
            formulaVersion: { type: string, example: v1 }
            updatedAt: { type: string, format: date-time }
    RewardRules:
      type: object
      required: [dailyPoints, tiers, applyEffects]
      properties:
        dailyPoints:
          type: array
          minItems: 1
          items:
            type: object
            required: [minSteps, points]
            properties:
              minSteps: { type: integer, minimum: 0 }
              points: { type: integer, minimum: 0, maximum: 1000 }
        tiers:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: object
            required: [status, minPoints, extensionDays, payoutDelayDays]
            properties:
              status: { $ref: '#/components/schemas/RewardStatus' }
              minPoints: { type: integer, minimum: 0 }
              extensionDays: { type: integer, minimum: 0, maximum: 60 }
              payoutDelayDays: { type: integer, minimum: 0, maximum: 60 }
        applyEffects: { type: boolean, description: "'\"Apply reward effects\" toggle'" }
    ClaimsProcessingSetting:
      type: object
      required: [standardProcessingDays]
      properties:
        standardProcessingDays: { type: integer, minimum: 1, maximum: 60, default: 7 }
    AssignmentSetting:
      type: object
      required: [defaultMaxClients]
      properties:
        defaultMaxClients: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Preferences:
      type: object
      required: [notifications]
      properties:
        notifications:
          type: object
          required: [chatMessages, estimateUpdates, claimUpdates]
          properties:
            chatMessages: { type: boolean }
            estimateUpdates: { type: boolean }
            claimUpdates: { type: boolean }

    # -------------------------------------------------------------- notifications
    Notification:
      type: object
      required: [id, type, body, createdAt]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [NoAgentAvailable, ClientAssigned] }
        body: { type: string, example: A client is waiting for an agent }
        relatedUserId: { type: [string, 'null'], format: uuid }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    # -------------------------------------------------------------- rewards
    RewardResultInput:
      type: object
      required: [client_id, period, points, status]
      additionalProperties: false
      properties:
        client_id: { type: string, format: uuid }
        period: { $ref: '#/components/schemas/Period' }
        points: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/RewardStatus' }
    RewardEffectsClient:
      type: object
      required: [rewardStatus, extensionDays, payoutDelayDays, applyEffects, rewardNote, simulated]
      properties:
        rewardStatus: { $ref: '#/components/schemas/RewardStatus' }
        period: { oneOf: [{ $ref: '#/components/schemas/Period' }, { type: 'null' }] }
        rewardPoints: { type: [integer, 'null'] }
        extensionDays: { type: integer }
        payoutDelayDays: { type: integer }
        applyEffects: { type: boolean }
        rewardNote:
          type: string
          example: Your Gold level gives you 14 extra days to pay each premium and delays claim payouts by 5 days.
        simulated: { type: boolean, const: true, description: "Screens say \"Simulated for this course demo\"" }
    StepSource:
      type: string
      enum: [Sensor, Sample]
    StepDay:
      type: object
      required: [day, steps, points, locked]
      properties:
        day: { type: string, format: date }
        steps: { type: integer }
        points: { type: integer, enum: [0, 10, 20, 30], description: "Sample bands; follows the reward rules" }
        source: { $ref: '#/components/schemas/StepSource' }
        locked: { type: boolean }
    SyncStatus:
      type: string
      enum: [Synced, Pending, Failed]
    RewardSummary:
      type: object
      required: [period, points, status, todayPoints, syncStatus]
      properties:
        period: { $ref: '#/components/schemas/Period' }
        points: { type: integer, description: "This month's points (reset each month)" }
        status: { $ref: '#/components/schemas/RewardStatus' }
        nextLevel: { oneOf: [{ $ref: '#/components/schemas/RewardStatus' }, { type: 'null' }] }
        pointsToNextLevel: { type: [integer, 'null'] }
        todayPoints: { type: integer }
        syncStatus: { $ref: '#/components/schemas/SyncStatus' }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
