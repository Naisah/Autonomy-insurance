    servers: *core
    post:
      tags: [RewardEffects]
      operationId: adminClosePeriodNow
      summary: Close the current Rewards period for every client now (Demo only)
      description: |
        Admin's "Close period now" on the admin console (spec 02 F3, decision Q12). core-api calls
        rewards-api `POST /internal/rewards/close-period` with a service token scoped
        `rewards:close-period`; rewards-api then sends each client's result to
        `POST /api/rewards/results` as usual. Available only when `DEMO_MODE=true`.
      x-roles: [Admin]
      x-stories: [F3, G3, G4]
      x-priority: Should
      x-demo: true
      responses:
        '200':
          description: Closed; the results are queued for delivery
          content:
