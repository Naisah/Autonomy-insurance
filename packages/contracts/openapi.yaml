openapi: 3.1.0
info:
  title: Autonomy Insurance API
  version: 1.0.0
  contact:
    name: Autonomy Insurance team (ITS120P)
  summary: One contract for the three services of Autonomy Insurance (auth, core-api, rewards-api).
  description: |
    Source of truth for every request and response shape (spec 05). Code that disagrees with
    this file is wrong, or this file is changed first, in its own commit (constitution principle 2).

    ## Services
    Each path declares its service with a path-level `servers` entry: auth on port 4001,
    core-api on 4002, rewards-api on 4003. `/health` exists on all three.

    ## Extensions on every operation
    - `x-roles`: who may call it. Values: `public`, `Client`, `Agent`, `Manager`, `Admin`,
      `service` (a service-account token, the "service key"). The authorization matrix test is
      generated from this field.
    - `x-stories`: product-spec stories served (spec 02).
    - `x-priority`: Must, Should or Could.
    - `x-demo: true`: available only when `DEMO_MODE=true`; the UI labels it "Demo only".

    ## Reward data boundary (X9)
    Schemas ending in `Client` may carry reward fields. Schemas ending in `Staff` never do.
    Reward fields: `rewardNote`, `rewardStatus`, `rewardPoints`, `payoutDelayDays`,
    `payoutDueDate`, `reasonLabel`. The lint fails if a `*Staff` schema gains one of them.

    ## Tokens
    - User access token: RS256 JWT, 15 minutes, claims `sub`, `role`, `sid`, `aud`, `iss`, `exp`, `iat`.
      Normal login gives `aud = core-api`; Rewards SSO gives `aud = rewards-api` (Client only).
    - Refresh token: opaque, 7 days, rotated on every use. Web receives it in an httpOnly cookie
      (`ai_refresh`), mobile in the response body.
    - Service key: client-credentials JWT from `POST /service/token`, `aud = core-api`, with scopes.
      Accepted only by `POST /api/rewards/results` and `/internal/*` routes. Every other route
      rejects it, and those routes reject every user token.

    ## Errors
    All errors use the `Error` body. Codes: UNAUTHORIZED (401, session expired or no token),
    FORBIDDEN (403), NOT_FOUND (404), VALIDATION (400), CONFLICT (409), ACCOUNT_BLOCKED (429 on
    login), RATE_LIMITED (429), AI_UNAVAILABLE (503), NO_AGENT_ASSIGNED (409, the client is waiting
    for an agent), INVALID_STATE (409).

    ## Money, dates and ids
    Money is a string with two decimals in pesos (`"1818.88"`). Dates are `YYYY-MM-DD`, times are
    ISO 8601 UTC. Ids are UUIDs; `INS-4829` and `CLM-1042` are separate display numbers.
    Lists use cursor pagination (`limit`, `cursor`, response `nextCursor`).

    ## Real-time chat (Socket.IO, core-api, path `/socket.io`)
    Handshake: `auth: { token: <access token> }`. Invalid token closes the connection.
    Client to server:
    - `conversation:join { conversationId }` -> ack `{ ok: true }` or `{ ok: false, code }`.
      Re-checked on every join, so a reassignment removes access.
    - `message:send { conversationId, clientMessageId, body }` (body 1 to 2,000 chars).
    - `conversation:read { conversationId, lastReadMessageId }`.
    Server to client:
    - `message:ack { clientMessageId, id, createdAt }` to the sender (persist first, then emit).
    - `message:new Message` to room `conv:{conversationId}`. A file message has `kind: Attachment` and
      the same `attachment` field as the REST `Message` (files are sent over REST, not the socket).
    - `conversation:unread { conversationId, unreadCount }` to the other participant.
    - `access_revoked { conversationId }` when a client is reassigned away from this agent.
    - `escalation:opened` and `escalation:resolved { conversationId, escalationId }` to the manager.
    A resend with the same `clientMessageId` returns the existing message (dedupe).
servers:
  - url: http://localhost:4002
    description: core-api (default; auth and rewards-api paths override this)
tags:
  - { name: System }
  - { name: Auth, description: "Accounts, sessions and tokens (auth service)" }
  - { name: Accounts, description: "Staff accounts, roles, availability and limits (auth service)" }
  - { name: SSO, description: "Single sign-on into the Rewards app and service tokens (auth service)" }
  - { name: Internal, description: "Service-to-service routes, service key only" }
  - { name: Dashboard }
  - { name: Chat }
  - { name: Escalations }
  - { name: AI }
  - { name: Estimates }
  - { name: Policies }
  - { name: Claims }
  - { name: Settings }
  - { name: Notifications }
  - { name: RewardEffects, description: "Reward results and their effects in the main system (core-api)" }
  - { name: Rewards, description: "Rewards app back end (rewards-api)" }

x-servers:
  auth: &auth
    - url: http://localhost:4001
      description: auth
  core: &core
    - url: http://localhost:4002
      description: core-api
  rewards: &rewards
    - url: http://localhost:4003
      description: rewards-api

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- System
  /health:
    servers:
      - { url: http://localhost:4001, description: "auth" }
      - { url: http://localhost:4002, description: "core-api" }
      - { url: http://localhost:4003, description: "rewards-api" }
    get:
      tags: [System]
      operationId: getHealth
      summary: Service health
      security: []
      x-roles: [public]
      x-stories: [X6]
      x-priority: Must
      responses:
        '200':
          description: The service is up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
              example: { status: ok, service: core-api, version: 1.0.0 }

  # ---------------------------------------------------------------- Auth (auth service)
  /auth/register:
    servers: *auth
    post:
      tags: [Auth]
      operationId: register
      summary: Register a client account
      description: |
        Creates a Client, hashes the password (argon2id) and runs agent assignment in the same
        transaction. When no agent is Available with room, the client is created waiting
        (`agentStatus: Waiting`) and Admin and managers are notified.
      security: []
      x-roles: [public]
      x-stories: [A1]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/Validation' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    servers: *auth
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in with email and password
      description: |
        Wrong email or password gives the same generic message. Five failures in 10 minutes block
        the email for 5 minutes (429 ACCOUNT_BLOCKED with `retryAfterSeconds`).
      security: []
      x-roles: [public]
      x-stories: [A1, X3]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/AccountBlocked' }
  /auth/refresh:
    servers: *auth
    post:
      tags: [Auth]
      operationId: refresh
      summary: Rotate the refresh token and get a new access token
      description: Web sends the `ai_refresh` cookie; mobile sends `refreshToken` in the body. Reusing an old refresh token revokes the session.
      security: []
      x-roles: [public]
      x-stories: [A3]
      x-priority: Must
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    servers: *auth
    post:
      tags: [Auth]
      operationId: logout
      summary: Sign out of this session (also ends its Rewards SSO sessions)
      x-roles: [Client, Agent, Manager, Admin]
      x-stories: [A3]
      x-priority: Must
      responses:
        '204': { description: "Signed out" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout-all:
    servers: *auth
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Sign out of all devices
      x-roles: [Client, Agent, Manager, Admin]
      x-stories: [A3]
      x-priority: Must
      responses:
        '204': { description: "Every session revoked" }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    servers: *auth
    get:
      tags: [Auth]
      operationId: getMe
      summary: The signed-in user
      x-roles: [Client, Agent, Manager, Admin]
      x-stories: [A3, A1]
      x-priority: Must
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/change-password:
    servers: *auth
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Change own password (also clears must-change-password)
      x-roles: [Client, Agent, Manager, Admin]
      x-stories: [A3, A4]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204': { description: "Password changed; other sessions revoked" }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/forgot-password:
    servers: *auth
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: Request a password reset (Could, decision D3; not built unless approved)
      security: []
      x-roles: [public]
      x-stories: [A6]
      x-priority: Could
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '202': { description: "Accepted; the same answer whether or not the email exists" }

  # ---------------------------------------------------------------- Accounts (auth service)
  /users:
    servers: *auth
    get:
      tags: [Accounts]
      operationId: listUsers
      summary: List accounts (Admin all; Manager own team only)
      x-roles: [Admin, Manager]
      x-stories: [A4, F2]
      x-priority: Must
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - { name: q, in: query, description: Name or email contains, schema: { type: string, maxLength: 100 } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDirectoryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Accounts]
      operationId: createUser
      summary: Create a staff account (Manager or Agent; Admin only)
      description: Creates the account with `mustChangePassword = true`. An Agent needs a Manager; a Manager reports to the Admin. Creating an Agent re-runs assignment for waiting clients.
      x-roles: [Admin]
      x-stories: [A4]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDirectoryEntry' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}:
    servers: *auth
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Accounts]
      operationId: getUser
      summary: Get one account
      x-roles: [Admin, Manager]
      x-stories: [A4]
      x-priority: Must
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDirectoryEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Accounts]
      operationId: updateUser
      summary: Update an account
      description: |
        Admin: name, role, reportsTo, status, maxClients. Manager: maxClients for agents in their
        own team only. Raising a limit or activating an agent re-runs assignment for waiting clients.
      x-roles: [Admin, Manager]
      x-stories: [A4, F2]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffDirectoryEntry' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/availability:
    servers: *auth
    put:
      tags: [Accounts]
      operationId: setAvailability
      summary: Set own availability (Agent)
      description: Away agents get no new clients and keep existing ones. Becoming Available re-runs assignment.
      x-roles: [Agent]
      x-stories: [A4, F1]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability: { $ref: '#/components/schemas/Availability' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- SSO and service tokens (auth service)
  /sso/authorize:
    servers: *auth
    post:
      tags: [SSO]
      operationId: ssoAuthorize
      summary: Get a one-time code for the Rewards app (main mobile app, Client only)
      description: The code lives 60 seconds, is single use and is bound to the PKCE challenge and this session.
      x-roles: [Client]
      x-stories: [G1]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SsoAuthorizeRequest' }
      responses:
        '200':
          description: Code issued
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresInSeconds]
                properties:
                  code: { type: string }
                  expiresInSeconds: { type: integer, example: 60 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /sso/token:
    servers: *auth
    post:
      tags: [SSO]
      operationId: ssoToken
      summary: Exchange the code and PKCE verifier for Rewards tokens
      description: Gives an access token with `aud = rewards-api` (10 minutes) and a refresh token. The session is a child of the main session.
      security: []
      x-roles: [public]
      x-stories: [G1]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SsoTokenRequest' }
      responses:
        '200':
          description: Rewards tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /service/token:
    servers: *auth
    post:
      tags: [SSO]
      operationId: serviceToken
      summary: Get a service key (client credentials)
      description: For rewards-api (`reward:write`, `reward:read-effects`), auth (`directory:write`) and core-api (`users:reassign`, `rewards:close-period`). A service token can never act as a user.
      security: []
      x-roles: [public]
      x-stories: [G4]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceTokenRequest' }
      responses:
        '200':
          description: Service token
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, expiresInSeconds, scopes]
                properties:
                  accessToken: { type: string }
                  expiresInSeconds: { type: integer }
                  scopes: { type: array, items: { type: string } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /.well-known/jwks.json:
    servers: *auth
    get:
      tags: [SSO]
      operationId: getJwks
      summary: Public keys for verifying tokens
      security: []
      x-roles: [public]
      x-stories: [A3, G1]
      x-priority: Must
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys: { type: array, items: { type: object, additionalProperties: true } }
  /internal/users/{id}/reports-to:
    servers: *auth
    parameters:
      - { $ref: '#/components/parameters/Id' }
    put:
      tags: [Internal]
      operationId: setReportsTo
      summary: Reassign a client to another agent (called by core-api for a manager)
      security:
        - serviceKey: []
      x-roles: [service]
      x-scope: users:reassign
      x-stories: [F2, B4]
      x-priority: Should
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportsTo]
              properties:
                reportsTo: { type: string, format: uuid }
      responses:
        '204': { description: "Reassigned; a user.reassigned event is written" }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Internal (core-api)
  /internal/directory-events:
    servers: *core
    post:
      tags: [Internal]
      operationId: receiveDirectoryEvents
      summary: Directory events from auth (user changes, availability, waiting clients)
      description: Events older than the stored version for that user are ignored.
      security:
        - serviceKey: []
      x-roles: [service]
      x-scope: directory:write
      x-stories: [A2, A4]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                events: { type: array, items: { $ref: '#/components/schemas/DirectoryEvent' }, maxItems: 100 }
      responses:
        '204': { description: "Applied" }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Dashboard
  /dashboard:
    servers: *core
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: Dashboard for the signed-in role
      description: One route, one shape per role, discriminated by `role` (decision C2). Counts match the matching lists.
      x-roles: [Client, Agent, Manager, Admin]
      x-stories: [F1, F2, F3, F4]
      x-priority: Must
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /manager/team:
    servers: *core
    get:
      tags: [Dashboard]
      operationId: getManagerTeam
      summary: Own team's agents with counts, availability and limits (no chat content, no reward data)
      x-roles: [Manager]
      x-stories: [F2]
      x-priority: Should
      responses:
        '200':
          description: Team
          content:
            application/json:
              schema:
                type: object
                required: [agents, waitingClients]
                properties:
                  agents: { type: array, items: { $ref: '#/components/schemas/TeamAgentStaff' } }
                  waitingClients: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ---------------------------------------------------------------- Chat
  /conversations:
    servers: *core
    get:
      tags: [Chat]
      operationId: listConversations
      summary: Conversations visible to me
      description: Client gets their one conversation. Agent gets assigned clients' conversations (search by client name). Manager gets conversations with an Open escalation from their team.
      x-roles: [Client, Agent, Manager]
      x-stories: [B1, B2, F2]
      x-priority: Must
      parameters:
        - { name: q, in: query, description: Client name contains (Agent), schema: { type: string, maxLength: 100 } }
        - { name: unreadOnly, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Conversations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ConversationSummary' } }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /conversations/{id}:
    servers: *core
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Chat]
      operationId: getConversation
      summary: One conversation
      x-roles: [Client, Agent, Manager]
      x-stories: [B1, B3]
      x-priority: Must
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{id}/messages:
    servers: *core
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Chat]
      operationId: listMessages
      summary: Message history, newest first, 30 per page
      x-roles: [Client, Agent, Manager]
      x-stories: [B3]
      x-priority: Must
      parameters:
        - { name: before, in: query, description: Message id cursor; returns older messages, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 30, default: 30 } }
      responses:
        '200':
          description: Messages
          content:
            application/json:
              schema:
                type: object
                required: [items, hasMore]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Message' } }
                  hasMore: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Chat]
      operationId: sendMessage
      summary: Send a message (REST fallback for the socket event)
      description: A waiting client gets 409 NO_AGENT_ASSIGNED. A manager can write only while an escalation is Open.
      x-roles: [Client, Agent, Manager]
      x-stories: [B1]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageRequest' }
      responses:
        '201':
          description: Stored (or the existing message for a repeated clientMessageId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoAgentAssigned' }
  /conversations/{id}/attachments:
    servers: *core
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Chat]
      operationId: sendAttachment
      summary: Send one file in the chat, with an optional caption
      description: |
        One JPEG, PNG or PDF, at most 5,242,880 bytes (5 MB). The server checks the type by the
        file signature, not the name or the declared type; a mismatch is FILE_TYPE_NOT_ALLOWED and
        nothing is stored. A waiting client gets 409 NO_AGENT_ASSIGNED, as for a message. A resend
        with the same `clientMessageId` returns the existing message. The new message is also sent
        as `message:new` to the conversation room. Admin and the AI chatbot never receive files.
      x-roles: [Client, Agent]
      x-stories: [B5]
      x-priority: Should
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SendAttachmentRequest' }
            encoding:
              file:
                contentType: image/jpeg, image/png, application/pdf
      responses:
        '201':
          description: Stored (or the existing message for a repeated clientMessageId)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          description: |
            Invalid input (VALIDATION). `error.fields.file` is `FILE_TOO_LARGE` or
            `FILE_TYPE_NOT_ALLOWED` when the file is the problem.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/NoAgentAssigned' }
        '429': { $ref: '#/components/responses/RateLimited' }
  /attachments/{id}/content:
    servers: *core
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Chat]
      operationId: getAttachmentContent
      summary: Download or preview a chat file
      description: |
        Allowed for the client of the conversation, the agent currently assigned to that client,
        and a manager while an escalation of that conversation is Open. A reassigned-away agent
        loses access at once. Anyone else, Admin included, gets 404 so the file's existence is not
        revealed.
      x-roles: [Client, Agent, Manager]
      x-stories: [B5]
      x-priority: Should
      responses:
        '200':
          description: The file, with its stored content type
          headers:
            Content-Disposition:
              description: '`inline` for images, `attachment` for PDFs, with the file name'
              schema: { type: string }
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            application/pdf:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /conversations/{id}/read:
    servers: *core
