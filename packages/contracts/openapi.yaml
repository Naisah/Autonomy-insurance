  # ---------------------------------------------------------------- Reward effects (core-api)
  /api/rewards/results:
    servers: *core
    post:
      tags: [RewardEffects]
      operationId: receiveRewardResult
      summary: Receive a monthly reward result from rewards-api (service key only)
      description: |
        One result per client per period; a resend replaces the earlier result. Each save appends
        a status-history row and logs the effects. `status` must match the thresholds for `points`.
        401: missing or invalid key. 403: a valid token that is not the service key (any user token).
        404: client not found or not a client.
      security:
        - serviceKey: []
      x-roles: [service]
      x-scope: reward:write
      x-stories: [G4, G5]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RewardResultInput' }
            example: { client_id: 7b0c7f0e-5d7e-4d32-9a65-2f4f9c1f8a11, period: '2026-11', points: 430, status: Gold }
      responses:
        '201':
          description: Saved (or replaced)
          content:
            application/json:
              schema:
                type: object
                required: [client_id, period, status, replaced]
                properties:
                  client_id: { type: string, format: uuid }
                  period: { type: string }
                  status: { $ref: '#/components/schemas/RewardStatus' }
                  replaced: { type: boolean }
        '400': { $ref: '#/components/responses/Validation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
