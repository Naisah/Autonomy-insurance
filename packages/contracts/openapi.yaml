      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Chat]
      operationId: markConversationRead
      summary: Mark messages read up to a message
      x-roles: [Client, Agent, Manager]
      x-stories: [B2]
      x-priority: Must
      requestBody:
        required: true
        content:
          application/json:
            schema:
