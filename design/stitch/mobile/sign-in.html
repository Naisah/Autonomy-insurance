  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&amp;family=DM+Sans:wght@400;600;700&amp;family=Hanken+Grotesk:wght@700;800&amp;display=swap" rel="stylesheet">

    .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons {
      display: inline-block; width: 1em; height: 1em; line-height: 1 !important;

<body class="bg-surface text-on-surface font-body antialiased">
  <div class="max-w-[390px] min-h-[844px] mx-auto bg-surface flex flex-col justify-between px-5 py-8">

    <!-- Top Logo & Header -->
    <div class="flex flex-col gap-6">
      <div class="flex items-center gap-2.5">
        <div class="grid grid-cols-3 gap-0.5 p-1 bg-surface-card rounded-sm border border-outline" aria-hidden="true">
          <span class="w-2.5 h-2.5 bg-mapua-red"></span>
          <span class="w-2.5 h-2.5 bg-mapua-gold"></span>
          <span class="w-2.5 h-2.5 bg-mapua-red"></span>
          <span class="w-2.5 h-2.5 bg-mapua-gold"></span>
          <span class="w-2.5 h-2.5 bg-pure-white"></span>
          <span class="w-2.5 h-2.5 bg-light-gray"></span>
          <span class="w-2.5 h-2.5 bg-mapua-red"></span>
          <span class="w-2.5 h-2.5 bg-light-gray"></span>
          <span class="w-2.5 h-2.5 bg-mapua-gold"></span>
        </div>
        <span class="font-headline text-headline-md text-on-surface-strong tracking-tight">Autonomy Insurance</span>
      </div>

      <div>
        <h1 class="font-display text-display-md-mobile text-on-surface-strong">Sign in</h1>
        <p class="font-body text-body-md text-on-surface-muted mt-1">Welcome back. Check your policy, track claims, or message Maya anytime.</p>
      </div>

      <!-- Feedback Banner -->
      <div id="signin-feedback" role="status" aria-live="polite" class="hidden px-4 py-3 rounded-xl bg-secondary-container border border-secondary font-body text-body-sm text-on-secondary-container"></div>

      <!-- Sign In Card -->
      <form onsubmit="handleSignIn(event)" class="bg-surface-card rounded-2xl border border-outline p-5 flex flex-col gap-4 shadow-sm">
        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-lg text-on-surface-strong">Email</span>
          <input id="signin-email" type="email" required value="elena.rostova@email.com" placeholder="you@email.com" class="min-h-[44px] rounded-full bg-surface border border-outline px-4 py-2.5 font-body text-body-md text-on-surface-strong placeholder:text-on-surface-muted focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
        </label>

        <div class="flex flex-col gap-1.5">
          <div class="flex items-center justify-between">
            <label for="signin-password" class="font-label text-label-lg text-on-surface-strong">Password</label>
            <button type="button" onclick="handleForgot()" class="min-h-[44px] px-1 font-label text-label-sm text-primary hover:underline">
              Forgot password?
            </button>
          </div>
          <div class="relative flex items-center">
            <input id="signin-password" type="password" required value="Autonomy2026!" placeholder="Enter your password" class="w-full min-h-[44px] rounded-full bg-surface border border-outline pl-4 pr-12 py-2.5 font-body text-body-md text-on-surface-strong placeholder:text-on-surface-muted focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
            <button type="button" onclick="togglePassword()" aria-label="Show password" class="absolute right-1 w-11 h-11 rounded-full flex items-center justify-center text-on-surface-muted hover:text-on-surface-strong">
              <span id="signin-eye" class="material-symbols-outlined text-[20px]" aria-hidden="true">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full min-h-[48px] mt-1 px-6 py-3 rounded-full bg-primary text-on-primary hover:bg-primary-hover font-label text-label-lg whitespace-nowrap transition-colors">
          Sign in
        </button>
      </form>

      <!-- Link to Create Account -->
      <div class="text-center font-body text-body-md text-on-surface">
        New to Autonomy Insurance?
        <a href="register.html" class="font-title text-primary hover:underline ml-1">Create account</a>
      </div>
    </div>

    <!-- Footer Note -->
    <footer class="pt-6 border-t border-outline flex items-center justify-center gap-2 text-on-surface-muted">
      <span class="material-symbols-outlined text-[18px]" aria-hidden="true">devices</span>
      <span class="font-body text-body-sm">One account works on web and mobile.</span>
    </footer>

  </div>

  <script>
    function togglePassword() {
      const input = document.getElementById('signin-password');
      const eye = document.getElementById('signin-eye');
      const show = input.type === 'password';
      input.type = show ? 'text' : 'password';
      eye.textContent = show ? 'visibility_off' : 'visibility';
    }

    function showFeedback(msg) {
      const box = document.getElementById('signin-feedback');
      box.textContent = msg;
      box.classList.remove('hidden');
    }

    function handleForgot() {
      showFeedback('Password reset link sent to your email address.');
    }

    function handleSignIn(e) {
      e.preventDefault();
      showFeedback('Signed in! Continuing to biometric unlock...'); setTimeout(() => { window.location.href = 'biometric-unlock.html'; }, 500);
    }
  </script>


<script src="../../prototype/proto-links.js" defer></script>
</body></html>
