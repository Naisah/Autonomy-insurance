  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&amp;family=DM+Sans:wght@400;600;700&amp;family=Hanken+Grotesk:wght@700;800&amp;display=swap" rel="stylesheet">

    .material-symbols-outlined, .material-symbols-rounded, .material-symbols-sharp, .material-icons {
      display: inline-block; width: 1em; height: 1em; line-height: 1 !important;
      box-sizing: content-box; overflow: hidden; white-space: nowrap; direction: ltr; vertical-align: middle;
    }
  </style>

<body class="bg-surface text-on-surface font-body antialiased">
  <div class="max-w-[390px] min-h-[844px] mx-auto bg-surface flex flex-col">

    <!-- Top Bar -->
    <header class="sticky top-0 z-30 bg-surface-card border-b border-outline px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2">
        <a href="client-claims.html" aria-label="Back to Claims" class="w-11 h-11 -ml-2 rounded-full hover:bg-surface flex items-center justify-center text-on-surface-strong shrink-0">
          <span class="material-symbols-outlined text-[22px]" aria-hidden="true">arrow_back</span>
        </a>
        <h1 class="font-headline text-title-lg text-on-surface-strong">File a claim</h1>
      </div>
      <span class="font-mono text-mono-md text-on-surface-muted">Step 2 of 4</span>
    </header>

    <main class="flex-1 px-4 py-5 flex flex-col gap-5">

      <!-- 4-Step Stepper (Details Step Active) -->
      <nav aria-label="Claim steps" class="bg-surface-card rounded-2xl border border-outline p-3 grid grid-cols-4 gap-1.5">
        <div class="flex flex-col items-center gap-1 text-center">
          <span class="w-7 h-7 rounded-full bg-success text-on-success font-label text-label-sm flex items-center justify-center">
            <span class="material-symbols-outlined text-[16px]" aria-hidden="true">check</span>
          </span>
          <span class="font-label text-label-sm text-on-surface-muted">Policy</span>
        </div>

        <div class="flex flex-col items-center gap-1 text-center" aria-current="step">
          <span class="w-7 h-7 rounded-full bg-primary text-on-primary font-label text-label-sm flex items-center justify-center">2</span>
          <span class="font-label text-label-sm text-primary">Details</span>
        </div>

        <div class="flex flex-col items-center gap-1 text-center">
          <span class="w-7 h-7 rounded-full bg-surface border border-outline text-on-surface-muted font-label text-label-sm flex items-center justify-center">3</span>
          <span class="font-label text-label-sm text-on-surface-muted">Docs</span>
        </div>

        <div class="flex flex-col items-center gap-1 text-center">
          <span class="w-7 h-7 rounded-full bg-surface border border-outline text-on-surface-muted font-label text-label-sm flex items-center justify-center">4</span>
          <span class="font-label text-label-sm text-on-surface-muted">Review</span>
        </div>
      </nav>

      <!-- Feedback Banner -->
      <div id="claim-mobile-toast" role="status" aria-live="polite" class="hidden px-4 py-3 rounded-xl bg-success text-on-success font-body text-body-sm"></div>

      <!-- Details Form Card -->
      <form onsubmit="handleContinue(event)" class="bg-surface-card rounded-2xl border border-outline p-4 flex flex-col gap-4">
        <div>
          <h2 class="font-headline text-headline-md text-on-surface-strong">Claim details</h2>
          <p class="font-body text-body-sm text-on-surface-muted mt-0.5">Policy #INS-4829 • 20-Year Term Life ₱2M</p>
        </div>

        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-lg text-on-surface-strong">Claim type</span>
          <select class="min-h-[44px] rounded-full bg-surface border border-outline px-4 py-2.5 font-body text-body-md text-on-surface-strong focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
            <option selected>Critical illness</option>
            <option>Disability</option>
            <option>Death</option>
          </select>
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-lg text-on-surface-strong">Date of event</span>
          <input type="date" value="2026-11-15" class="min-h-[44px] rounded-full bg-surface border border-outline px-4 py-2.5 font-mono text-mono-md text-on-surface-strong focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-lg text-on-surface-strong">Amount requested (₱)</span>
          <input type="number" value="32000" min="500" class="min-h-[44px] rounded-full bg-surface border border-outline px-4 py-2.5 font-mono text-mono-md text-on-surface-strong focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
        </label>

        <label class="flex flex-col gap-1.5">
          <span class="font-label text-label-lg text-on-surface-strong">What happened?</span>
          <textarea rows="3" placeholder="Describe the event in plain language..." class="rounded-2xl bg-surface border border-outline p-3.5 font-body text-body-md text-on-surface-strong placeholder:text-on-surface-muted focus:border-primary focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">Emergency hospital admission on Nov 15 for cardiac evaluation and overnight observation.</textarea>
        </label>

        <div class="flex items-center gap-2 pt-1">
          <button type="button" onclick="saveDraft()" class="flex-1 min-h-[44px] px-4 py-2.5 rounded-full bg-surface border border-outline hover:border-on-surface font-label text-label-lg text-on-surface-strong whitespace-nowrap">
            Save draft
          </button>
          <button type="submit" class="flex-1 min-h-[44px] px-4 py-2.5 rounded-full bg-primary text-on-primary hover:bg-primary-hover font-label text-label-lg whitespace-nowrap">
            Continue
          </button>
        </div>
      </form>

      <p class="text-center font-body text-body-sm text-on-surface-muted pb-2">Payouts are simulated in this demo.</p>

    </main>
  </div>

  <script>
    function showToast(msg) {
      const box = document.getElementById('claim-mobile-toast');
      box.textContent = msg;
      box.classList.remove('hidden');
    }
    function saveDraft() {
      showToast('Draft saved. You can finish anytime.');
    }
    function handleContinue(e) {
      e.preventDefault();
      showToast('Details saved — moving to Documents step.');
    }
  </script>


<script src="../../prototype/proto-links.js" defer></script>
</body></html>
